name: Bot de ofertas

# Modo "bucle" (el normal): cada ejecución vigila durante 55 minutos y al terminar lanza la
# siguiente, así el bot está siempre en marcha. Para pararlo: cancela la ejecución en curso
# (Actions → la ejecución → Cancel workflow run) o desactiva el workflow.
# Si la cadena se cortara, la tarea programada de abajo (o una ejecución a mano) la reanuda.

on:
  schedule:
    # IMPORTANTE: GitHub solo ejecuta las tareas programadas si la última persona que tocó
    # estas líneas "cron" tiene permiso de escritura en el repo. Edítalas tú desde GitHub.
    #
    # Cada 10 minutos (repo PÚBLICO: minutos gratis e ilimitados).
    # Si el repo es PRIVADO, usa "*/30 * * * *" para no pasar de 2.000 minutos al mes.
    - cron: "3-59/10 * * * *"
    # Día 1 de cada mes: commit de "latido" para que GitHub no pause el bot por inactividad.
    - cron: "23 5 1 * *"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [bucle, pasada, prueba, diagnostico, simular]
        default: bucle
      minutos:
        description: "Minutos de cada vuelta (modo bucle)"
        type: string
        default: "55"

concurrency:
  group: bot-ofertas-${{ github.event.schedule == '23 5 1 * *' && 'latido' || 'bot' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    if: github.event.schedule != '23 5 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write          # para lanzar la siguiente vuelta
    env:
      ACCION: ${{ inputs.accion || 'bucle' }}
      MINUTOS: ${{ inputs.minutos || '55' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # La "memoria" del bot (qué ha visto y de qué te ha avisado) se guarda en la caché
      # de Actions entre ejecución y ejecución.
      - name: Recuperar memoria del bot
        uses: actions/cache/restore@v5
        with:
          path: datos
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Ejecutar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_TELEFONO: ${{ secrets.CALLMEBOT_TELEFONO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          mkdir -p datos
          case "$ACCION" in
            prueba)      python bot.py --prueba ;;
            diagnostico) python bot.py --diagnostico ;;
            simular)     python bot.py --simular ;;
            pasada)      python bot.py --una-vez ;;
            *)           python bot.py --minutos "$MINUTOS" ;;
          esac

      - name: Guardar memoria del bot
        if: always() && (env.ACCION == 'pasada' || env.ACCION == 'bucle') && hashFiles('datos/ofertas.db') != ''
        uses: actions/cache/save@v5
        with:
          path: datos
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Lanzar la siguiente vuelta
        if: ${{ !cancelled() && env.ACCION == 'bucle' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f accion=bucle

  latido:
    if: github.event.schedule == '23 5 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Commit de latido
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultimo-latido
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ultimo-latido
          git commit -m "Latido mensual para que GitHub no pause el bot"
          git push
