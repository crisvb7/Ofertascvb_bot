name: Bot de ofertas

on:
  schedule:
    # Cada 10 minutos (repositorio PÚBLICO: minutos de Actions gratis e ilimitados).
    # Si tu repositorio es PRIVADO, cámbialo a "*/30 * * * *" para no pasar de los
    # 2.000 minutos gratis al mes.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        options: [pasada, prueba, simular]
        default: pasada

concurrency:
  group: bot-ofertas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ACCION: ${{ inputs.accion || 'pasada' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # La "memoria" del bot (qué ha visto y de qué te ha avisado) se guarda en la caché
      # de Actions entre ejecución y ejecución.
      - name: Recuperar memoria del bot
        uses: actions/cache/restore@v5
        with:
          path: datos
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Ejecutar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_TELEFONO: ${{ secrets.CALLMEBOT_TELEFONO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          mkdir -p datos
          case "$ACCION" in
            prueba)  python bot.py --prueba ;;
            simular) python bot.py --simular ;;
            *)       python bot.py --una-vez ;;
          esac

      - name: Guardar memoria del bot
        if: always() && env.ACCION == 'pasada' && hashFiles('datos/ofertas.db') != ''
        uses: actions/cache/save@v5
        with:
          path: datos
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}
