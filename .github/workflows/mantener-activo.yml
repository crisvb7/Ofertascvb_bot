name: Mantener activo

# GitHub pausa las tareas programadas de un repositorio público si pasa 60 días
# sin actividad. Este commit mensual lo evita.
on:
  schedule:
    - cron: "23 5 1 * *"   # día 1 de cada mes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Commit de latido
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultimo-latido
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ultimo-latido
          git commit -m "Latido mensual para que GitHub no pause el bot"
          git push
