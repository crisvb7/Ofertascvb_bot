# ─────────────────────────────────────────────────────────────────────────────
#  Bot de ofertas (consolas y piezas de PC) · configuración
#  Los tokens de Telegram/WhatsApp van en el archivo .env, no aquí.
# ─────────────────────────────────────────────────────────────────────────────

# Tu ubicación, para Wallapop (Oviedo por defecto).
ubicacion:
  lat: 43.3614
  lon: -5.8494
  radio_km: 120          # más lejos de esto solo avisa si el vendedor hace envíos
  aceptar_envio: true

# Qué cuenta como "buena oferta" además de tu precio máximo.
mercado:
  dias: 14                 # ventana para calcular la mediana de segunda mano
  muestras_minimas: 12     # anuncios mínimos antes de fiarse de la mediana
  descuento_minimo: 0.20   # avisa también si está un 20 % por debajo de la mediana
  bajada_minima_euros: 10  # vuelve a avisar de un anuncio ya avisado si baja al menos esto

# Cómo te avisa: cada oferta en su propio mensaje (con foto y enlace), de la más barata a
# la más cara. Las que están por debajo de tu máximo, o mucho más baratas que la mediana,
# llegan marcadas como 🔥 OFERTÓN.
avisos:
  todas: true            # true = también las que pasan de tu máximo; false = solo ofertones
  max_por_pasada: 25     # mensajes como mucho en cada pasada (si hay más, siguen en la próxima)
  comprobar_estado: true # vuelve a mirar los anuncios avisados y marca ❌ los vendidos/retirados
  dias_seguimiento: 3    # días que se siguen los anuncios y salen en el índice de cada tema
  # Piezas de PC de segunda mano: solo si salen al menos este % más baratas que nuevas
  # (precio_nuevo de cada pieza, o lo más barato que el bot la haya visto nueva estos días).
  rebaja_minima_usado: 0.15

# Grupo de Telegram con temas (🔥 Ofertones, 💰 Buen precio, 🏷️ Resto). Las piezas de PC van a
# su propio grupo (grupo_pc), con un tema 🖥️ por pieza y lo nuevo y lo usado juntos.
# Si pones aquí el id del grupo (empieza por -100), las ofertas van al grupo, cada una a su tema.
# El bot crea los temas solo; los mensajes del sistema siguen yendo a tu chat privado.
telegram:
  grupo_id: "-1004319446143"
  nombre: Ofertas        # el bot le pone este nombre al grupo (necesita «Cambiar información del grupo»)
  temas: {nueva_oferton: 57, nueva_buen_precio: 58, usada_oferton: 3, usada_buen_precio: 7, usada_resto: 12,
          pc_ryzen-7-5700x3d: 3120, pc_ryzen-7-5800x3d: 3121, pc_ryzen-5-5600: 3122,
          pc_rx-9060-xt-16gb: 3123, pc_rx-9070: 3124, pc_rx-9070-xt: 3240}
  # Grupo aparte para las piezas de PC, con un tema por pieza. Sin id, el bot lo busca solo
  # entre los grupos en los que está, por este nombre (o uno que diga "componentes").
  grupo_pc:
    id:
    nombre: PC Components
    temas: {}

# Cada cuánto se mira cada sitio (minutos). No lo bajes mucho o te bloquearán.
# En GitHub Actions el bot no puede ir más rápido que el cron de .github/workflows/bot.yml.
intervalos_min:
  wallapop: 5
  vinted: 10
  cex: 30
  cashconverters: 30
  carrefour: 15
  game: 15
  elcorteingles: 15
  chollometro: 10
  tiendas: 30

fuentes:
  wallapop: true
  vinted: true
  cex: true            # tiendas CeX (segunda mano con garantía; dice si hay en Oviedo/Gijón)
  cashconverters: true # Cash Converters (segunda mano con garantía)
  carrefour: true      # tiendas: Carrefour (incluye su marketplace)
  game: true           # tiendas: GAME (nuevas y seminuevas; descarta las agotadas)
  elcorteingles: true  # tiendas: El Corte Inglés (descarta las agotadas)
  chollometro: true    # chollos de tiendas oficiales (Amazon, MediaMarkt, PcComponentes...)
  tiendas: true        # fichas concretas de la lista "tiendas" de abajo

chollometro_feeds:
  - https://www.chollometro.com/rss/nuevos

# ── Qué es una consola ─────────────────────────────────────────────────────────
# Todo se mira en el TÍTULO, en minúsculas y sin tildes (expresiones regulares).
# Resultado: ✅ consola → a su tema · ❓ dudosa → tema "Revisar" con el motivo · 🚫 descartada.

# 1) DESCARTAR siempre: no es una consola en venta.
excluir_comun:
  - '\b(busco|compro|se busca|cerco|cherche|recherche|suche|zoek|procuro|looking for)\b'
  - '\balquil'
  - '\b(reparo|reparamos|reparacion|reparaciones)\b'
  - '\b(caja vacia|solo (la )?caja|boite vide|scatola vuota|caixa vazia|empty box|leere verpackung)\b'
  - '\b(concours|concorso|sorteo|giveaway|gewinnspiel)\b'
  - '\b(foto|photo|poster|affiche|lamina)\b'
  - '\bportable\b'
  - '\b(coleccionista|collector|steelbook)'
  - '^\W*(unidad|lector|lecteur|lettore|laufwerk) de (disco|discos|disque)'   # el lector suelto

# 2) ACCESORIOS Y JUEGOS. Si el título EMPIEZA por uno de estos, se descarta
#    ("Mando DualSense PS5", "Volant ps5", "Juego GTA PS5"). Si sale en medio y el título no dice
#    que sea la consola, va a ❓ Revisar ("PlayStation 5/GTA VI").
accesorios:
  - '\b(mandos?|manettes?|mannettes?|controllers?|controles?|controladora?s?|comandos?|joysticks?|joypads?|pads?|dualsense|gamepads?|scuf)\b'
  - '\b(volantes?|volant|volanti|lenkrad|pedales|pedali|pedals?|thrustmaster|logitech|fanatec|g29|g923|t300|t598|cockpit)\b'
  - '\b(jeux|jeu|juegos?|videojuegos?|giochi|gioco|spiele|spiel|jogos?|games?)\b'
  - '\b(gta|grand theft auto|fifa|fc ?2\d|ea sports|call of duty|spider-?man|god of war|astro bot|gran turismo|hogwarts|elden ring|minecraft|red dead|resident evil|mortal kombat|nba 2k\d*|assassin|cyberpunk|last of us|ghost of)\b'
  - '\b(auriculares|cascos|casque|cuffie|headset|kopfhorer|pulse)\b'
  - '\b(cargador|chargeur|caricatore|ladestation|charging|base de carga|estacion de carga|dock)\b'
  - '\b(fundas?|housse|custodia|soporte|support|stand|skins?|vinilos?|pegatinas?|carcasas?|tapas?|faceplates?|cover)\b'
  - '\b(cables?|hdmi|ssd|nvme|disco duro|tarjeta|camara|camera|ventilador|monitor|mueble|teclado|raton)\b'
  # (solo al principio) lotes de juegos o mandos: "Lot de 7 jeux ps5", "Vários jogos playstation5"
  - '^\W*(lot|lote|lotto|lots|varios|varias|plusieurs|several|diversi)\b.{0,25}\b(jeux|jeu|juegos?|jogos?|giochi|games?|manettes?|mandos?|controllers?)\b'
  # (solo al principio) el nombre de la consola seguido de un accesorio: "PS5 Controller GTA VI"
  - '^\W*(sony\s+|microsoft\s+)?(ps\s?5|playstation\s?5|play\s?station\s?5|xbox\s?series\s?x)\s+(controller|manette|mando|dualsense|volant|volante|headset|casque|auriculares)\b'

# 3) Señales de que SÍ es la consola (pesan más que un accesorio mencionado: "PS5 Slim + 2 mandos").
pistas_consola:
  - 'consol'
  - '\b(slim|fat|digital|digitale|numerique|standard|estandar|chassis)\b'
  - '\b\d+\s?(tb|to|gb|go)\b'
  - '\b(lector|disco|lecteur|lettore|laufwerk|disc|blu-?ray)\b'
  # "Xbox Series X (no incluye caja ni mando)", "PS5 sans manette": es la consola
  - '\b(sin|sans|senza|no incluye|without|ohne|sem)\b.{0,15}\b(mandos?|manettes?|controllers?|caja|boite|scatola)\b'
  # packs: "PS5 con 2 mandos", "Xbox + juegos", "PS5 avec manettes"...
  - '(\+|\b(con|avec|with|mit|com|e|y|und|incluye|inclus|incluso)\b)\s*(\d+\s*)?(mandos?|manettes?|controllers?|controles?|comandos?|joysticks?|joypads?|pads?|juegos?|jeux|games?|giochi|spiele|jogos?)\b'

# 4) DUDAS: la consola te llega igual, pero al tema ❓ Revisar, diciendo por qué.
dudas:
  - '^\W*(cambio|intercambio|echange|scambio|tausch|troca)\b'
  - '\b(cambio|intercambio|echange|scambio|tausch|troca)\s+(por|x|pour|per|gegen|for)\b'
  - '\b(averiad[ao]s?|no funciona|no enciende|para piezas|despiece|baneada|safe mode|modo seguro|en panne|defectueuse|guasta|kaputt|defekt|avariada|hs)\b'
  - '\b(lire|lisez|leer|lee|leggere|leggi|ler|leia|read)\b.{0,20}\b(annonce|anuncio|annuncio|description|descripcion|descrizione|descricao)\b'

# Lo mismo en la DESCRIPCIÓN: descartar si solo se vende la caja.
excluir_descripcion_comun:
  - 'caja vacia'
  - 'solo (vendo )?la caja'

# ── Qué es una pieza de PC (productos con "tipo: componente") ──────────────────
# Cada pieza tiene su propio tema en el grupo («🖥️ Ryzen 7 5700X3D»...), con lo nuevo y lo usado.
# Igual que con las consolas: ✅ la pieza → a su tema · ❓ dudosa → a su tema, marcada · 🚫 fuera.
componentes:
  # 1) DESCARTAR siempre: portátiles, PCs montados, consolas portátiles...
  excluir:
    - '\b(portatil|portatiles|laptop|notebook|ultrabook)\b'
    - '^\W*(pc|ordenador|ordenadores|torre|equipo|sobremesa|setup|workstation|servidor)\b'
    - '\b(pc|ordenador|torre|equipo)\s+(gaming|gamer|completo|completa|sobremesa|montado|entero)\b'
    - '\b(mini\s?pc|steam\s?deck|rog\s?ally|legion\s?go|msi\s?claw)\b'
  # 2) Si el título EMPIEZA por uno de estos, no es la pieza ("Disipador para Ryzen 7 5700X3D",
  #    "Placa B550 para Ryzen 5000", "Caja RX 9070"). Si además dice que es la pieza, va marcada.
  accesorios:
    - '\b(disipador(es)?|ventilador(es)?|refrigeracion|refrigerador(es)?|aio|backplates?|soportes?|brackets?|anti-?sag|riser)\b'
    - '\b(cables?|alargador(es)?|adaptador(es)?|bloques?|waterblock|pasta|thermal|pads?|pegatinas?|fundas?|skins?)\b'
    - '\b(placas?|motherboard|memorias?|ram|ddr4|ddr5|fuentes?|psu|cajas?|chasis|monitor(es)?|teclados?|ratones?)\b'
    - '\b(juegos?|codigos?|keys?|claves?|cupon(es)?)\b'
  # 3) Señales de que SÍ es la pieza suelta.
  pistas:
    - '\b(procesador|cpu|micro|microprocesador)\b'
    - '\b(tarjeta grafica|tarjeta de video|grafica|gpu|video card|graphics card|carte graphique|scheda video|grafikkarte)\b'
    - '\b(sapphire|xfx|powercolor|asrock|gigabyte|aorus|asus|tuf|msi|yeston|pulse|nitro|pure|reaper|hellhound|red devil|steel legend|challenger|swift|mercury|prime|gaming oc|eagle|windforce)\b'
    - '\b(precintad[oa]s?|sin abrir|a estrenar|nuev[oa]s?|garantia|factura|ticket)\b'
  # 4) DUDAS: te llega igual, marcada con el motivo.
  dudas:
    - '\b(averiad[ao]s?|no funciona|no enciende|para piezas|despiece|sin imagen|artefactos|defectuos[ao]|rot[ao]|en panne|defectueuse|guasta|kaputt|defekt|avariada)\b'
    - '\b(minado|mineria|mining|minar)\b'
    - '^\W*(cambio|intercambio|echange|scambio|tausch|troca)\b'
    - '\b(cambio|intercambio)\s+(por|x)\b'
    - '\b(pack|combo|lote)\b'          # "kit" no: la RAM se vende como "kit 2x16GB"
    - '\+\s*(placa|b450|b550|b650|b850|x570|a520|a620|ram|memoria|ddr4|ddr5|fuente)'
    - '\+\s*(ryzen|procesador|cpu|micro|rx|rtx|grafica)\b'
    - '\b(con|y|incluye)\s+(placa|b450|b550|x570|a520|memoria ram|ram|ddr4|ddr5)\b'
    - '\b(lire|lisez|leer|lee|leggere|leggi|ler|leia|read)\b.{0,20}\b(annonce|anuncio|annuncio|description|descripcion|descrizione|descricao)\b'


# --- Anuncios falsos (solo segunda mano: Wallapop y Vinted) --------------------
# Lo que no pase este filtro no te llega. Vinted no deja ver el perfil del vendedor,
# así que allí solo se miran las fotos y las frases.
antifraude:
  activo: true
  sin_valoraciones: true    # vendedor sin ninguna valoración (Wallapop)
  dias_cuenta_min: 30       # cuenta creada menos de 30 días antes de publicar el anuncio (Wallapop)
  fotos_repetidas: true     # la foto ya salió en otro anuncio anterior de otro vendedor
  # contacto o pago fuera de la plataforma (en el título o la descripción).
  # No cuenta si va negado justo antes: "no contesto por WhatsApp", "nada de Bizum"...
  frases:
    - '\b(whats\s?app|whatsap|wasap|wassap|wsp|telegram)\b'
    - '\b(solo|sólo|únicamente|unicamente)\s+(bizum|transferencia|paypal)\b'
    - '\bpaypal\s+(amigos|familia|friends)\b'
    - '\b(llama|llamar|escrib\w*|contact\w*|mand\w*)\b.{0,20}\b(al|a mi|mi)\s+(n[uú]mero|m[oó]vil|tel[eé]fono|correo|email|mail)\b'
    - '(?<![\d.,])(\+?34[\s.-]?)?[67](?:[\s.-]?\d){8}(?![\d.,])'              # un móvil español
    - '\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b'                                       # un e-mail

productos:
  # PVP actual en España: 649,99 € con lector, 599,99 € Digital.
  - nombre: PS5
    busquedas: ["ps5", "playstation 5"]
    incluir: ['\bps\s?5\b', 'playstation\s?5', 'play\s?station\s?5', '\bplay\s?5\b']
    excluir: ['\bpro\b', '\bportal\b', '\bpsvr', '\bvr\s?2?\b', '\bedge\b']
    tope: 650      # nunca te manda nada más caro que esto (lo que cuesta nueva)
    segunda_mano:
      min: 300     # por debajo es un precio ridículo: accesorio, juego, averiada o estafa
      max: 420     # por debajo de esto = 🔥 OFERTÓN
    nuevo:
      min: 300     # quita juegos, mandos, cuotas "6,50 €/mes" y precios irreales
      max: 529

  # PVP actual en España: 799,99 € con lector, 749,99 € Digital (y con poco stock).
  - nombre: Xbox Series X
    busquedas: ["xbox series x"]
    incluir: ['series\s?x\b', '\bxsx\b']
    excluir: ['series\s?s\b', 'series\s?x\s?[|/-]\s?s\b', '\bone\s?[xs]\b', '\belite\b']
    tope: 800      # nunca te manda nada más caro que esto (lo que cuesta nueva)
    segunda_mano:
      min: 300     # por debajo es un precio ridículo
      max: 420
    nuevo:
      min: 300
      max: 699

  # ── Piezas de PC (cada una en su propio tema 🖥️ del grupo) ─────────────────────
  # Procesadores AM4 para tu ROG Strix B550-F (actualiza la BIOS antes de cambiar el procesador).
  # Con lo escaso que va, el 5700X3D nuevo ha estado entre 265 y 330 €.
  - nombre: Ryzen 7 5700X3D
    tipo: componente
    busquedas: ["ryzen 7 5700x3d", "5700x3d"]
    incluir: ['\b5700\s?x3d\b']
    tope: 360      # nunca te manda nada más caro que esto
    precio_nuevo: 270  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano:
      min: 150     # por debajo: precio ridículo o estafa
      max: 230     # por debajo de esto = 🔥 OFERTÓN
    nuevo:
      min: 180
      max: 270

  # Reedición de 2026, nuevo sobre 360 €.
  - nombre: Ryzen 7 5800X3D
    tipo: componente
    busquedas: ["ryzen 7 5800x3d", "5800x3d"]
    incluir: ['\b5800\s?x3d\b']
    tope: 420
    precio_nuevo: 365  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 170, max: 290}
    nuevo: {min: 250, max: 340}

  # La opción barata (nuevo sobre 155 €). Vale también el 5600X/5600T/5600XT; fuera el 5600G y el 5600X3D.
  - nombre: Ryzen 5 5600
    tipo: componente
    busquedas: ["ryzen 5 5600"]
    incluir: ['\b(ryzen|r5)\s?-?\s?5?\s?-?\s?5600(x|t|xt)?\b']
    tope: 190
    precio_nuevo: 155  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 60, max: 100}
    nuevo: {min: 90, max: 135}

  # Gráficas. La de 16 GB: la de 8 GB queda fuera.
  - nombre: RX 9060 XT 16GB
    tipo: componente
    busquedas: ["rx 9060 xt"]
    incluir: ['(\brx\s?|\b)9060\s?xt\b']
    excluir: ['\b8\s?(gb|go|g)\b']
    tope: 620
    precio_nuevo: 480  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 300, max: 400}
    nuevo: {min: 360, max: 470}

  # La RX 9070 (sin XT ni GRE).
  - nombre: RX 9070
    tipo: componente
    busquedas: ["rx 9070"]
    incluir: ['(\brx\s?|\b)9070\b(?!\s?-?(xt|gre))']
    excluir: ['\bgre\b']
    tope: 750
    precio_nuevo: 650  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 380, max: 520}
    nuevo: {min: 450, max: 590}

  # ── Piezas para un PC nuevo AM5 (Ryzen 7 9800X3D) ─────────────────────────────
  # El 9800X3D lo has visto nuevo a 375,99 €; su mínimo anterior fue 424,88 €.
  - nombre: Ryzen 7 9800X3D
    tipo: componente
    busquedas: ["ryzen 7 9800x3d", "9800x3d"]
    incluir: ['\b9800\s?x3d\b']
    tope: 460
    precio_nuevo: 376  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 230, max: 330}
    nuevo: {min: 280, max: 380}

  # 32 GB de DDR5 de sobremesa (mejor 2x16 a 6000 CL30, pero vale cualquiera).
  # Fuera las de portátil (SO-DIMM) y las de 16 o 64 GB.
  - nombre: DDR5 32GB
    tipo: componente
    busquedas: ["ddr5 32gb"]
    incluir: ['\bddr5\b(?=.*\b(32\s?gb?|2\s?x\s?16\s?gb?)\b)|\b(32\s?gb?|2\s?x\s?16\s?gb?)\b(?=.*\bddr5\b)']
    excluir: ['\bso-?dimm\b', '\bsodimm\b', '\b(portatil|laptop|notebook)\b', '\b64\s?gb?\b', '\b2\s?x\s?32', '\becc\b', '\bddr4\b']
    accesorios: ['\b(disipador(es)?|ventilador(es)?|refrigeracion|cables?|fundas?|pegatinas?|cajas?|placas?|motherboard|procesador|cpu|grafica|tarjeta grafica|ssd|disco|portatil|pc|ordenador|torre)\b']
    pistas: ['\b(kit|memoria|ram|dimm|udimm|corsair|kingston|fury|vengeance|g\.?skill|trident|ripjaws|crucial|teamgroup|team group|t-?force|adata|xpg|lexar|patriot|forgeon|goodram)\b']
    tope: 520
    precio_nuevo: 429  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 120, max: 300}
    nuevo: {min: 180, max: 400}

  # Placas AM5 B650 / B850 (A620 y X670/X870 fuera: unas flojas, otras caras).
  - nombre: Placa B650/B850
    tipo: componente
    busquedas: ["placa b650", "b650m"]
    incluir: ['\bb[68]50(e|m)?\b']
    excluir: ['\b(am4|b550|b450|x570)\b']
    accesorios: ['\b(disipador(es)?|ventilador(es)?|refrigeracion|cables?|fundas?|pegatinas?|antenas?|backplates?|memorias?|ram|ddr5|procesador|cpu|ryzen|grafica|tarjeta grafica|ssd|disco|pc|ordenador|torre)\b']
    pistas: ['\b(placa|placa base|motherboard|asus|msi|gigabyte|aorus|asrock|biostar|tuf|prime|tomahawk|eagle|steel legend|pro rs|gaming)\b']
    tope: 180
    precio_nuevo: 84  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 50, max: 100}
    nuevo: {min: 70, max: 110}

  # La RX 9070 XT. En 2026 ha estado entre 640 y 725 € nueva.
  - nombre: RX 9070 XT
    tipo: componente
    busquedas: ["rx 9070 xt"]
    incluir: ['(\brx\s?|\b)9070\s?-?xt\b']
    tope: 900
    precio_nuevo: 659  # lo que cuesta nueva ahora (noviembre 2026)
    segunda_mano: {min: 450, max: 600}
    nuevo: {min: 550, max: 680}

  # ── El resto del PC nuevo ─────────────────────────────────────────────────────
  # Fuente de 850 W o más, 80 Plus Gold o mejor (la que pide la RX 9070 XT).
  - nombre: Fuente 850W Gold
    tipo: componente
    busquedas: ["fuente 850w", "fuente alimentacion 850w gold"]
    incluir: ['\b(8[5-9]0|9[0-9]0|1000)\s?w\b(?=.*\b(gold|oro|platinum|platino|titanium)\b)|\b(gold|oro|platinum|platino|titanium)\b(?=.*\b(8[5-9]0|9[0-9]0|1000)\s?w\b)']
    excluir: ['\b(sai|ups|inversor|generador|cargador|bateria|power ?bank|power ?station|estacion de energia|solar|panel|microondas|altavoz|amplificador)\b']
    accesorios: ['\b(cables?|extension(es)?|alargador(es)?|adaptador(es)?|cablemod|ventilador(es)?|grafica|procesador|placa|memoria)\b']
    pistas: ['\b(psu|corsair|seasonic|be quiet|msi|thermaltake|nox|mars gaming|asus|gigabyte|fsp|cooler master|deepcool|nzxt|evga|antec|asrock|modular)\b']
    tope: 140
    precio_nuevo: 83   # Thermaltake 850 W Gold en PcComponentes
