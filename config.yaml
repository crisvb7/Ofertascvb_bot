# ─────────────────────────────────────────────────────────────────────────────
#  Bot de ofertas de consolas · configuración
#  Los tokens de Telegram/WhatsApp van en el archivo .env, no aquí.
# ─────────────────────────────────────────────────────────────────────────────

# Tu ubicación, para Wallapop (Oviedo por defecto).
ubicacion:
  lat: 43.3614
  lon: -5.8494
  radio_km: 120          # más lejos de esto solo avisa si el vendedor hace envíos
  aceptar_envio: true

# Qué cuenta como "buena oferta" además de tu precio máximo.
mercado:
  dias: 14                 # ventana para calcular la mediana de segunda mano
  muestras_minimas: 12     # anuncios mínimos antes de fiarse de la mediana
  descuento_minimo: 0.20   # avisa también si está un 20 % por debajo de la mediana
  bajada_minima_euros: 10  # vuelve a avisar de un anuncio ya avisado si baja al menos esto

# Cómo te avisa: cada oferta en su propio mensaje (con foto y enlace), de la más barata a
# la más cara. Las que están por debajo de tu máximo, o mucho más baratas que la mediana,
# llegan marcadas como 🔥 OFERTÓN.
avisos:
  todas: true            # true = también las que pasan de tu máximo; false = solo ofertones
  max_por_pasada: 25     # mensajes como mucho en cada pasada (si hay más, siguen en la próxima)
  comprobar_estado: true # vuelve a mirar los anuncios avisados y marca ❌ los vendidos/retirados
  dias_seguimiento: 3    # días que se siguen los anuncios y salen en el índice de cada tema

# Grupo de Telegram con temas (🔥 Ofertones, 💰 Buen precio, 🏷️ Resto).
# Si pones aquí el id del grupo (empieza por -100), las ofertas van al grupo, cada una a su tema.
# El bot crea los temas solo; los mensajes del sistema siguen yendo a tu chat privado.
telegram:
  grupo_id: "-1004319446143"   # «Ofertas PS5 y XBOX»
  temas: {nueva_oferton: 57, nueva_buen_precio: 58, usada_oferton: 3, usada_buen_precio: 7, usada_resto: 12}

# Cada cuánto se mira cada sitio (minutos). No lo bajes mucho o te bloquearán.
# En GitHub Actions el bot no puede ir más rápido que el cron de .github/workflows/bot.yml.
intervalos_min:
  wallapop: 5
  vinted: 10
  cex: 30
  cashconverters: 30
  carrefour: 15
  game: 15
  elcorteingles: 15
  chollometro: 10
  tiendas: 30

fuentes:
  wallapop: true
  vinted: true
  cex: true            # tiendas CeX (segunda mano con garantía; dice si hay en Oviedo/Gijón)
  cashconverters: true # Cash Converters (segunda mano con garantía)
  carrefour: true      # tiendas: Carrefour (incluye su marketplace)
  game: true           # tiendas: GAME (nuevas y seminuevas; descarta las agotadas)
  elcorteingles: true  # tiendas: El Corte Inglés (descarta las agotadas)
  chollometro: true    # chollos de tiendas oficiales (Amazon, MediaMarkt, PcComponentes...)
  tiendas: true        # fichas concretas de la lista "tiendas" de abajo

chollometro_feeds:
  - https://www.chollometro.com/rss/nuevos

# ── Qué es una consola ─────────────────────────────────────────────────────────
# Todo se mira en el TÍTULO, en minúsculas y sin tildes (expresiones regulares).
# Resultado: ✅ consola → a su tema · ❓ dudosa → tema "Revisar" con el motivo · 🚫 descartada.

# 1) DESCARTAR siempre: no es una consola en venta.
excluir_comun:
  - '\b(busco|compro|se busca|cerco|cherche|recherche|suche|zoek|procuro|looking for)\b'
  - '\balquil'
  - '\b(reparo|reparamos|reparacion|reparaciones)\b'
  - '\b(caja vacia|solo (la )?caja|boite vide|scatola vuota|caixa vazia|empty box|leere verpackung)\b'
  - '\b(concours|concorso|sorteo|giveaway|gewinnspiel)\b'
  - '\b(foto|photo|poster|affiche|lamina)\b'
  - '\bportable\b'
  - '\b(coleccionista|collector|steelbook)'
  - '^\W*(unidad|lector|lecteur|lettore|laufwerk) de (disco|discos|disque)'   # el lector suelto

# 2) ACCESORIOS Y JUEGOS. Si el título EMPIEZA por uno de estos, se descarta
#    ("Mando DualSense PS5", "Volant ps5", "Juego GTA PS5"). Si sale en medio y el título no dice
#    que sea la consola, va a ❓ Revisar ("PlayStation 5/GTA VI").
accesorios:
  - '\b(mandos?|manettes?|mannettes?|controllers?|controles?|controladora?s?|comandos?|joysticks?|joypads?|pads?|dualsense|gamepads?|scuf)\b'
  - '\b(volantes?|volant|volanti|lenkrad|pedales|pedali|pedals?|thrustmaster|logitech|fanatec|g29|g923|t300|t598|cockpit)\b'
  - '\b(jeux|jeu|juegos?|videojuegos?|giochi|gioco|spiele|spiel|jogos?|games?)\b'
  - '\b(gta|grand theft auto|fifa|fc ?2\d|ea sports|call of duty|spider-?man|god of war|astro bot|gran turismo|hogwarts|elden ring|minecraft|red dead|resident evil|mortal kombat|nba 2k\d*|assassin|cyberpunk|last of us|ghost of)\b'
  - '\b(auriculares|cascos|casque|cuffie|headset|kopfhorer|pulse)\b'
  - '\b(cargador|chargeur|caricatore|ladestation|charging|base de carga|estacion de carga|dock)\b'
  - '\b(fundas?|housse|custodia|soporte|support|stand|skins?|vinilos?|pegatinas?|carcasas?|tapas?|faceplates?|cover)\b'
  - '\b(cables?|hdmi|ssd|nvme|disco duro|tarjeta|camara|camera|ventilador|monitor|mueble|teclado|raton)\b'
  # (solo al principio) lotes de juegos o mandos: "Lot de 7 jeux ps5", "Vários jogos playstation5"
  - '^\W*(lot|lote|lotto|lots|varios|varias|plusieurs|several|diversi)\b.{0,25}\b(jeux|jeu|juegos?|jogos?|giochi|games?|manettes?|mandos?|controllers?)\b'
  # (solo al principio) el nombre de la consola seguido de un accesorio: "PS5 Controller GTA VI"
  - '^\W*(sony\s+|microsoft\s+)?(ps\s?5|playstation\s?5|play\s?station\s?5|xbox\s?series\s?x)\s+(controller|manette|mando|dualsense|volant|volante|headset|casque|auriculares)\b'

# 3) Señales de que SÍ es la consola (pesan más que un accesorio mencionado: "PS5 Slim + 2 mandos").
pistas_consola:
  - 'consol'
  - '\b(slim|fat|digital|digitale|numerique|standard|estandar|chassis)\b'
  - '\b\d+\s?(tb|to|gb|go)\b'
  - '\b(lector|disco|lecteur|lettore|laufwerk|disc|blu-?ray)\b'
  # "Xbox Series X (no incluye caja ni mando)", "PS5 sans manette": es la consola
  - '\b(sin|sans|senza|no incluye|without|ohne|sem)\b.{0,15}\b(mandos?|manettes?|controllers?|caja|boite|scatola)\b'
  # packs: "PS5 con 2 mandos", "Xbox + juegos", "PS5 avec manettes"...
  - '(\+|\b(con|avec|with|mit|com|e|y|und|incluye|inclus|incluso)\b)\s*(\d+\s*)?(mandos?|manettes?|controllers?|controles?|comandos?|joysticks?|joypads?|pads?|juegos?|jeux|games?|giochi|spiele|jogos?)\b'

# 4) DUDAS: la consola te llega igual, pero al tema ❓ Revisar, diciendo por qué.
dudas:
  - '^\W*(cambio|intercambio|echange|scambio|tausch|troca)\b'
  - '\b(cambio|intercambio|echange|scambio|tausch|troca)\s+(por|x|pour|per|gegen|for)\b'
  - '\b(averiad[ao]s?|no funciona|no enciende|para piezas|despiece|baneada|safe mode|modo seguro|en panne|defectueuse|guasta|kaputt|defekt|avariada|hs)\b'
  - '\b(lire|lisez|leer|lee|leggere|leggi|ler|leia|read)\b.{0,20}\b(annonce|anuncio|annuncio|description|descripcion|descrizione|descricao)\b'

# Lo mismo en la DESCRIPCIÓN: descartar si solo se vende la caja.
excluir_descripcion_comun:
  - 'caja vacia'
  - 'solo (vendo )?la caja'

productos:
  # PVP actual en España: 649,99 € con lector, 599,99 € Digital.
  - nombre: PS5
    busquedas: ["ps5", "playstation 5"]
    incluir: ['\bps\s?5\b', 'playstation\s?5', 'play\s?station\s?5', '\bplay\s?5\b']
    excluir: ['\bpro\b', '\bportal\b', '\bpsvr', '\bvr\s?2?\b', '\bedge\b']
    tope: 650      # nunca te manda nada más caro que esto (lo que cuesta nueva)
    segunda_mano:
      min: 300     # por debajo es un precio ridículo: accesorio, juego, averiada o estafa
      max: 420     # por debajo de esto = 🔥 OFERTÓN
    nuevo:
      min: 300     # quita juegos, mandos, cuotas "6,50 €/mes" y precios irreales
      max: 529

  # PVP actual en España: 799,99 € con lector, 749,99 € Digital (y con poco stock).
  - nombre: Xbox Series X
    busquedas: ["xbox series x"]
    incluir: ['series\s?x\b', '\bxsx\b']
    excluir: ['series\s?s\b', 'series\s?x\s?[|/-]\s?s\b', '\bone\s?[xs]\b', '\belite\b']
    tope: 800      # nunca te manda nada más caro que esto (lo que cuesta nueva)
    segunda_mano:
      min: 300     # por debajo es un precio ridículo
      max: 420
    nuevo:
      min: 300
      max: 699

  # ¿También te vale una PS5 Pro? Quita los '#' de este bloque.
  # - nombre: PS5 Pro
  #   busquedas: ["ps5 pro"]
  #   incluir: ['\bps\s?5\s?pro\b', 'playstation\s?5\s?pro']
  #   excluir: ['\bportal\b', '\bedge\b', '\bmando\b']
  #   segunda_mano: {min: 300, max: 600}
  #   nuevo: {min: 450, max: 749}

# Fichas de producto concretas (precio y stock). Pega la URL de la ficha.
# Útil para la Xbox Series X, que suele estar agotada: te avisa cuando vuelve.
# Amazon casi siempre bloquea esto: para Amazon usa Keepa o CamelCamelCamel.
tiendas: []
